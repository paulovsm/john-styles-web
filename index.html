<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/avif" href="/FA_Icon_White.avif" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Fonts are loaded here rather than via @import in CSS: an @import inside a
       JS-imported stylesheet is invisible to the browser's preload scanner and
       serialises HTML -> JS -> CSS -> DNS -> CSS -> font (4 round trips) before
       text renders in the right face. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" />
  <!-- The hero image is the landing page's LCP element. Without this hint the
       browser only discovers it after React renders, which on the promoted
       landing lands ~400ms in. -->
  <link rel="preload" as="image" href="/experience-v2/universal-hero-v2.webp" fetchpriority="high" />
  <meta name="description" content="Transforme seu estilo para tudo o que você vive com a Fleek Authority e John Styles, seu especialista digital de estilo." />
  <meta name="author" content="Fleek Authority" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://fleekauthority.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Fleek Authority" />
  <meta property="og:title" content="Fleek Authority | Transforme seu estilo com John Styles" />
  <meta property="og:description" content="Transforme seu estilo para tudo o que você vive com curadoria e orientação personalizada." />
  <meta property="og:url" content="https://fleekauthority.com/" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:image" content="https://fleekauthority.com/experience-v2/universal-hero-v2.webp" />
  <meta property="og:image:alt" content="Mulher e homem em uma cena editorial da Fleek Authority" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Fleek Authority | Transforme seu estilo com John Styles" />
  <meta name="twitter:description" content="Transforme seu estilo para tudo o que você vive com curadoria e orientação personalizada." />
  <meta name="twitter:image" content="https://fleekauthority.com/experience-v2/universal-hero-v2.webp" />
  <meta name="twitter:image:alt" content="Mulher e homem em uma cena editorial da Fleek Authority" />
  <title>Fleek Authority | Transforme seu estilo com John Styles</title>
  <script id="page-structured-data" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://fleekauthority.com/#organization",
          "name": "Fleek Authority",
          "url": "https://fleekauthority.com/",
          "description": "Curadoria, ferramentas e orientação digital para transformar o estilo em escolhas mais claras para todas as ocasiões.",
          "logo": {
            "@type": "ImageObject",
            "url": "https://fleekauthority.com/FA_Icon_White.avif"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://fleekauthority.com/#website",
          "url": "https://fleekauthority.com/",
          "name": "Fleek Authority",
          "publisher": { "@id": "https://fleekauthority.com/#organization" },
          "inLanguage": "pt-BR"
        },
        {
          "@type": "WebPage",
          "@id": "https://fleekauthority.com/#webpage",
          "url": "https://fleekauthority.com/",
          "name": "Fleek Authority | Transforme seu estilo com John Styles",
          "description": "A Fleek Authority reúne curadoria, ferramentas e John Styles, o expert digital que ajuda você a resolver o que vestir em cada ocasião.",
          "isPartOf": { "@id": "https://fleekauthority.com/#website" },
          "about": { "@id": "https://fleekauthority.com/#organization" },
          "primaryImageOfPage": {
            "@type": "ImageObject",
            "url": "https://fleekauthority.com/experience-v2/universal-hero-v2.webp"
          },
          "inLanguage": "pt-BR"
        }
      ]
    }
  </script>
  <script>
    // Apply the saved/system theme before paint to avoid a flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* no-op */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
